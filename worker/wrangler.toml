name = "security-lookup-hub"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://jamalrizki.github.io,http://localhost:8000,http://127.0.0.1:8000"

# Burst limit: 10 lookups per minute per visitor IP. In testing on the Free
# plan (2026-10-14) this binding did not enforce anything; the hourly limit in
# src/index.js is what actually applies. Kept in case the plan starts honouring it.
# namespace_id is account-wide; 73001 is reserved for this app.
[[ratelimits]]
name = "LOOKUP_LIMITER"
namespace_id = "73001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Store nothing about visitors: no Workers Logs or traces.
[observability]
enabled = false

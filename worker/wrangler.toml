name = "security-lookup-hub"
main = "src/index.js"
compatibility_date = "2025-09-01"
# enable_request_signal: request.signal fires when the visitor presses Stop (closes the
# request), so Ask stops calling the model and tools. Opt-in; no default-on date.
compatibility_flags = ["enable_request_signal"]
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://jamalrizki.github.io,http://localhost:8000,http://127.0.0.1:8000"
# Ask's model, "provider:model" (README: Switching Ask's model). Options:
#   anthropic:claude-haiku-5-5 (default)  anthropic:claude-sonnet-5-5
#   groq:openai/gpt-oss-120b (free)       openai:<model> (needs OPENAI_API_KEY)
# Chain: paid model (100 questions/day, KV-counted) -> free Groq -> OpenRouter free models.
ASK_MODEL = "anthropic:claude-haiku-5-5"
# ASK_EFFORT = "medium"   # Claude only; unset = the model's default

# News feeds: refreshed by this Cron Trigger (UTC) into the NEWS KV namespace.
# Each run refreshes one source (:17 KEV, :37 CISA, :57 The Hacker News) so a
# run stays inside the Free plan's 10 ms CPU budget. One trigger of the 5 the
# Free plan allows per account.
[triggers]
crons = ["17,37,57 * * * *"]

[[kv_namespaces]]
binding = "NEWS"
id = "117d6c53e6dd411591340fea41e51be4" # from: npx wrangler kv namespace create NEWS

# Ask's reference library: Workers AI (embeddings + reranker) and the Vectorize index
# that rag/ + worker/scripts/embed-books.mjs fill. Create the index before deploying:
#   npx wrangler vectorize create security-books --dimensions=384 --metric=cosine
# Without the index's data, search_reference finds nothing and Ask still works.
# remote = true: `wrangler dev` has no local Vectorize, so dev queries the real index.
[ai]
binding = "AI"

[[vectorize]]
binding = "BOOKS"
index_name = "security-books"
remote = true

# Store nothing about visitors: no Workers Logs or traces.
[observability]
enabled = false
